name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "v2"]
  workflow_dispatch:
    inputs:
      enable_ai_chat:
        description: "Enable AI Persona Chat (Kill switch: true / false)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm install

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_ENABLE_AI_CHAT: ${{ github.event.inputs.enable_ai_chat || vars.ENABLE_AI_CHAT || 'true' }}
          NEXT_PUBLIC_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NEXT_PUBLIC_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NEXT_PUBLIC_AI_API_URL: ${{ secrets.AI_API_URL }}
          NEXT_PUBLIC_AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: npx next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
